name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: PYTHONPATH=. python -m pytest tests/unit
      - run: python tests/benchmark/validate_golden.py --all-splits
      - run: python -m py_compile tests/benchmark/regression_gate.py
      - run: python -m compileall -q app agent rag ingestion embeddings vectorstore models
